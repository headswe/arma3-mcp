name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SQF and config with HEMTT
        run: |
          curl -sSL -o /tmp/hemtt.zip https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64.zip
          unzip -q /tmp/hemtt.zip -d /tmp/hemtt && chmod +x /tmp/hemtt/hemtt
          /tmp/hemtt/hemtt check
      # Built on Ubuntu 20.04 (glibc 2.31) so the .so loads on older server distros too.
      - name: Build extension
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive ubuntu:20.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq --no-install-recommends g++ cmake make >/dev/null &&
             cmake -S . -B out -DCMAKE_BUILD_TYPE=Release && cmake --build out"
          sudo chown -R "$(id -u):$(id -g)" build out
      - name: Extension needs at most glibc 2.31
        run: |
          newest=$(objdump -T build/Release/arma3_mcp_x64.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          test "$(printf '%s\nGLIBC_2.31\n' "$newest" | sort -V | tail -1)" = GLIBC_2.31
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test extension and MCP server against a simulated game
        run: |
          pip install ./server
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: arma3_mcp_x64.so
          path: build/Release/arma3_mcp_x64.so

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B out -A x64
          cmake --build out --config Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test extension and MCP server against a simulated game
        env:
          A3MCP_LIB: build/Release/arma3_mcp_x64.dll
        run: |
          pip install ./server
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: arma3_mcp_x64.dll
          path: build/Release/arma3_mcp_x64.dll

  package:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Package mod
        run: python3 tools/pack_mod.py out bin/arma3_mcp_x64.dll bin/arma3_mcp_x64.so
      - uses: actions/upload-artifact@v4
        with:
          name: "@arma3_mcp"
          path: out
