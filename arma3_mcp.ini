# arma3_mcp extension settings. Lives next to arma3_mcp_x64.dll in the @arma3_mcp folder.
# ARMA3_MCP_HOST, ARMA3_MCP_PORT, ARMA3_MCP_TOKEN, ARMA3_MCP_ENABLED and ARMA3_MCP_ALLOW_CLIENT
# environment variables override these.

# Address the MCP server connects to. Anyone who can reach it can run code in the game:
# keep it on 127.0.0.1 unless you also set a token and trust the network.
host = 127.0.0.1
port = 9120

# When set, the MCP server must send the same token (--token / ARMA3_MCP_TOKEN).
token =

# Set to 0 to load the mod without opening the port.
enabled = 1

# By default only the server (or the singleplayer / editor game) listens. Set to 1 to also listen
# on a multiplayer client, e.g. to inspect your own client's UI state.
allow_client = 0
